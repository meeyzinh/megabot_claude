<div class="card" id="taskCreateCard" style="display:none;">
    <h3>📚 Tạo nhiệm vụ</h3>

    <div class="voice-hint">
        💡 <strong>Cách sử dụng:</strong><br>
        Sau khi tạo nhiệm vụ, khi BẮT ĐẦU TRÒ CHUYỆN bạn hãy nói
        <span class="voice-keyword">"So-phi-a"</span>
        hoặc
        <span class="voice-keyword">"Xin chào"</span>
        để AI kích hoạt nhiệm vụ.
    </div>

    <textarea id="learningContent" maxlength="1000" placeholder="Nhập bất kỳ nội dung nhiệm vụ vào đây:
Ví dụ:
- Học từ tiếng Anh: Hello
- Yêu cầu học nội dung một bài tập tiếng Anh, Toán, Ngữ Văn....
- Uống thuốc, đi chợ, nấu cơm...." style="width:100%; height:120px;"></textarea>

    <button class="primary" onclick="createLearningTask()">Tạo</button>
    <div class="voice-hint">
        💡 <strong>Mẹo dùng giọng nói:</strong><br>
        Khi đã làm xong nhiệm vụ, bạn chỉ cần nói
        <span class="voice-keyword">"hoàn thành"</span>,
        <span class="voice-keyword">"xong rồi"</span>
        hoặc
        <span class="voice-keyword">"làm xong rồi"</span>
        thì nhiệm vụ sẽ được tự động xóa.
    </div>
</div>
