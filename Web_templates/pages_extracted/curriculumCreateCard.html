<div class="card" id="curriculumCreateCard" style="display:none;">
    <h3>✍️ Tạo bài học</h3>

    <div class="form-group">
        <label>Tên bài học</label>
        <input id="curriculumName" maxlength="100" placeholder="Ví dụ: Tiếng Anh giao tiếp cơ bản">
    </div>

    <div class="form-group">
        <label>Nội dung bài học</label>
        <textarea id="curriculumContent" maxlength="12000" placeholder="Nhập nội dung..."></textarea>
    </div>

    <button class="primary" onclick="createCurriculum()">🚀 Tạo bài học</button>
</div>
