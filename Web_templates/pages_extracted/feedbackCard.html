<div class="card" id="feedbackCard" style="display:none;">
    <h3>💬 Góp ý - Báo lỗi</h3>

    <div class="form-group">
        <label>Email nhận thông báo khi admin phản hồi</label>
        <input id="feedbackEmail" type="email" maxlength="150" placeholder="Ví dụ: tenban@gmail.com">
        <button class="secondary" style="margin-top:6px;" onclick="saveFeedbackEmail()">💾 Lưu email</button>
        <div id="feedbackEmailMessage" style="margin-top:8px;"></div>
    </div>

    <div class="form-group">
        <label>Nội dung góp ý</label>
        <textarea id="feedbackContent" maxlength="3000" placeholder="Nhập nội dung góp ý hoặc báo lỗi..." style="min-height:120px;"></textarea>
    </div>

    <button class="primary full-width" onclick="submitFeedback()">📨 Gửi góp ý</button>

    <div id="feedbackMessage" style="margin-top:10px;"></div>

    <div id="feedbackUserSection" style="display:none; margin-top:20px;">
        <h3>📬 Góp ý và phản hồi của bạn</h3>
        <div id="feedbackUserList"></div>
    </div>

    <div id="feedbackAdminSection" style="display:none; margin-top:20px;">
        <h3>📋 Danh sách góp ý</h3>
        <input id="feedbackSearch" placeholder="🔍 Tìm góp ý..." oninput="renderFeedbacks()" style="margin-bottom:12px;">
        <div id="feedbackList"></div>
    </div>
</div>
