<div class="card" id="memoryCard" style="display: block;">

    <!-- 🔥 TAB -->
    <div style="display:flex; gap:10px; margin-bottom:10px;">
        <button id="tabMemoryBtn" class="primary" onclick="switchTab('memory')">Bộ nhớ</button>
    </div>

    <div class="topbar" style="margin-bottom: 10px;">
        <h3 id="memoryTitle" style="margin: 0;">Quản lý Dữ liệu</h3>
    </div>

    <div style="display: flex; gap: 10px; margin-bottom: 15px; align-items: center;">
        <input id="memorySearchInput" placeholder="🔍 Tìm nội dung memory..." oninput="renderMemories()" style="margin: 0; flex: 1;">
        <button id="bulkDeleteBtn" class="danger" onclick="deleteSelectedMemories()" style="display: none; white-space: nowrap;">
            Xóa đã chọn (0)
        </button>
    </div>

    <div style="margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="selectAllMemories" onchange="toggleSelectAllMemories(this)" style="width: 16px; height: 16px; margin: 0; cursor: pointer;">
        <label for="selectAllMemories" style="cursor: pointer; font-size: 14px; user-select: none;">Chọn tất cả kết quả hiển thị</label>
    </div>

    <!-- 🔥 NÚT LOAD DATA -->
    <div id="loadDataWrapper" style="margin-bottom:10px;">
        <button class="primary" onclick="loadMemoryFromButton()" style="width:100%;">
            🔄 Tải dữ liệu Bộ nhớ
        </button>
    </div>

    <!-- MEMORY LIST -->
    <div id="memoryList"></div>

</div>
